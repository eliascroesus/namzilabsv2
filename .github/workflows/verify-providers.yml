name: Verify providers (read-only)

# Manual-only. Runs the one-time provider contract checks from
# PRE_LAUNCH_CHECKLIST.md items 1-3 without needing a laptop with the keys on it.
#
# Every check is read-only — GETs against the provider APIs, nothing written
# anywhere, no database involved. Safe to re-run at any time.
#
# Secrets are never echoed: they are passed to the scripts through `env:` only,
# and GitHub masks their values in the log. A missing secret is a clean SKIP
# with an explanation, not a crash.
on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Which provider(s) to verify"
        type: choice
        required: true
        default: all
        options:
          - all
          - close
          - calendly
          - instantly
          - sendblue
      # CL11 is the only check here that costs wall-clock time, and it costs it
      # on purpose: the only way to find out how long a Calendly page_token
      # lives is to hold one and retry it later. 60 keeps a routine run quick
      # and answers nothing about the connector — calendly.ts reuses a STORED
      # token on the next sweep, 600s later at base cadence and up to 3600s on
      # the widened webhook backstop, so those are the two numbers that matter.
      #
      # The ceiling is 6 hours (GitHub's per-job limit on hosted runners), so
      # even 3600 leaves well over four hours spare — every option here is
      # offerable. The script re-does this arithmetic with the real elapsed time
      # and refuses to start if it ever stops being true, rather than being
      # killed at the end with nothing to show.
      calendly_token_wait:
        # 60 was the default and tested a lifetime nothing depends on: the
        # connector reuses a continuation a full cadence interval later, so a
        # 60s pass is a fast green that answers no question anyone asked. 600 is
        # base cadence — the shortest gap that is real. Ages BOTH continuations
        # in one sleep (CL11 token, CL13 next_page URL).
        description: "Calendly CL11/CL13: seconds to age a continuation before retrying it (600 = base cadence, 3600 = webhook backstop; job ceiling is 6h)"
        type: choice
        required: true
        default: "600"
        options:
          - "600"
          - "3600"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # GitHub's documented per-job ceiling for hosted runners. Passed to the
      # scripts so the runtime guard checks against the real limit instead of
      # an assumption. IF A `timeout-minutes:` IS EVER ADDED TO THIS JOB, this
      # number has to become that number — a guard measuring against a ceiling
      # that is not the one enforcing itself is worse than no guard.
      JOB_TIMEOUT_MINUTES: "360"
    steps:
      # FIRST — before checkout and install, so elapsed time includes them.
      # A clock started after setup under-reports by a minute or two, which is
      # exactly the margin the guard exists to protect.
      - name: Prepare
        run: |
          echo "RESULTS=$RUNNER_TEMP/results.txt" >> "$GITHUB_ENV"
          echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each provider writes one line to $RESULTS: PASS / FAIL / SKIP.
      # `continue-on-error` lets every selected provider run even if an earlier
      # one fails, so one dispatch tells you about all three.
      - name: Close — Event Log pagination contract
        if: ${{ inputs.providers == 'all' || inputs.providers == 'close' }}
        continue-on-error: true
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${CLOSE_API_KEY:-}" ]; then
            echo "SKIP|Close|Secret CLOSE_API_KEY is not set on this repository." >> "$RESULTS"
            echo "::warning::Skipping Close — add the CLOSE_API_KEY secret (Close → Settings → Developer → API Keys) to run it."
            exit 0
          fi
          if pnpm tsx scripts/verify-close-pagination.ts; then
            echo "PASS|Close|Pagination contract holds." >> "$RESULTS"
          else
            code=$?
            echo "FAIL|Close|Script exited $code — see the Close step above for the failing check (C1-C5)." >> "$RESULTS"
            exit 1
          fi

      - name: Calendly — scheduled_events parameter contract
        if: ${{ inputs.providers == 'all' || inputs.providers == 'calendly' }}
        continue-on-error: true
        env:
          CALENDLY_API_TOKEN: ${{ secrets.CALENDLY_API_TOKEN }}
          # Both names, on purpose. The input keeps its old id because
          # `workflow_dispatch` renders inputs from the DEFAULT BRANCH's copy of
          # this file — renaming it while the change is still on a branch means
          # the UI passes the old id, the script sees nothing under the new one,
          # and a 60s default silently replaces the wait that was asked for.
          # Rename the input once this is on `main`, then drop the old line.
          CALENDLY_TOKEN_WAIT: ${{ inputs.calendly_token_wait }}
          CALENDLY_CONTINUATION_WAIT: ${{ inputs.calendly_token_wait }}
          # Time this step must NOT consume, because the steps after it need it.
          # Instantly paces itself at 3.2s between requests and walks two page
          # sizes, so it is the expensive one; Sendblue is a handful of GETs.
          # Zero when Calendly runs alone, because then nothing follows it.
          VERIFY_RESERVE_SECONDS: ${{ inputs.providers == 'all' && '900' || '0' }}
        run: |
          set -uo pipefail
          if [ -z "${CALENDLY_API_TOKEN:-}" ]; then
            echo "SKIP|Calendly|Secret CALENDLY_API_TOKEN is not set on this repository." >> "$RESULTS"
            echo "::warning::Skipping Calendly — add CALENDLY_API_TOKEN (Calendly -> Integrations & apps -> API & webhooks -> Personal Access Tokens)."
            exit 0
          fi
          if pnpm tsx scripts/verify-calendly.ts; then
            echo "PASS|Calendly|CL11 aged a page_token ${CALENDLY_TOKEN_WAIT}s. No check contradicted the pinned contract — READ THE INFO LINES: an ignored parameter is reported there, not as a failure." >> "$RESULTS"
          else
            code=$?
            # Exit 3 is the runtime guard refusing to start, not a contract
            # failure. Nothing was requested, so nothing was measured — saying
            # "see checks CL0-CL11" there would send you looking for output
            # that does not exist.
            if [ "$code" -eq 3 ]; then
              echo "FAIL|Calendly|REFUSED TO START — a ${CALENDLY_TOKEN_WAIT}s CL11 wait does not fit in the job's remaining time. No Calendly requests were made. See the [STOP] line above for the arithmetic; re-run with a smaller wait or with providers=calendly." >> "$RESULTS"
            else
              echo "FAIL|Calendly|Script exited $code — see checks CL0-CL11 above." >> "$RESULTS"
            fi
            exit 1
          fi

      - name: Instantly — emails walk + the analytics streams customers get
        if: ${{ inputs.providers == 'all' || inputs.providers == 'instantly' }}
        continue-on-error: true
        env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${INSTANTLY_API_KEY:-}" ]; then
            echo "SKIP|Instantly|Secret INSTANTLY_API_KEY is not set on this repository." >> "$RESULTS"
            echo "::warning::Skipping Instantly — add the INSTANTLY_API_KEY secret (a v2 key) to run it."
            exit 0
          fi
          if pnpm tsx scripts/verify-instantly.ts; then
            echo "PASS|Instantly|No check contradicted the pinned contract — READ THE INFO LINES: an ignored parameter is reported there, not as a failure." >> "$RESULTS"
          else
            code=$?
            echo "FAIL|Instantly|Script exited $code — a 401 means the key is invalid or v1-era; otherwise see checks I0-I7 above." >> "$RESULTS"
            exit 1
          fi

      - name: Sendblue — base URL, messages list, webhook list
        if: ${{ inputs.providers == 'all' || inputs.providers == 'sendblue' }}
        continue-on-error: true
        env:
          SENDBLUE_API_KEY_ID: ${{ secrets.SENDBLUE_API_KEY_ID }}
          SENDBLUE_API_SECRET: ${{ secrets.SENDBLUE_API_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${SENDBLUE_API_KEY_ID:-}" ] || [ -z "${SENDBLUE_API_SECRET:-}" ]; then
            echo "SKIP|Sendblue|Secrets SENDBLUE_API_KEY_ID and/or SENDBLUE_API_SECRET are not set." >> "$RESULTS"
            echo "::warning::Skipping Sendblue — add both SENDBLUE_API_KEY_ID and SENDBLUE_API_SECRET to run it."
            exit 0
          fi
          if pnpm tsx scripts/verify-sendblue.ts; then
            echo "PASS|Sendblue|Host, messages list and webhook list all confirmed." >> "$RESULTS"
          else
            code=$?
            echo "FAIL|Sendblue|Script exited $code — see checks S1-S5 above (wrong host and wrong auth headers are named explicitly)." >> "$RESULTS"
            exit 1
          fi

      - name: Summary
        if: ${{ always() }}
        run: |
          set -uo pipefail
          echo "## Provider verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Selected: \`${{ inputs.providers }}\`" >> "$GITHUB_STEP_SUMMARY"
          # Named even when Calendly did not run: a report that does not say
          # which wait it used cannot be compared against the next one, and 60
          # vs 600 is the difference between a number and an answer.
          echo "Calendly CL11 token wait: \`${{ inputs.calendly_token_wait }}s\` (600s = base cadence, 3600s = webhook backstop)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "${RESULTS:-/nonexistent}" ]; then
            echo "Nothing ran. (No provider selected, or the job stopped early.)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No provider checks ran."
            exit 1
          fi

          echo "| Provider | Result | What it means |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r status name detail; do
            case "$status" in
              PASS) icon="✅ PASS" ;;
              FAIL) icon="❌ FAIL" ;;
              *)    icon="⏭️ SKIPPED" ;;
            esac
            echo "| $name | $icon | $detail |" >> "$GITHUB_STEP_SUMMARY"
          done < "$RESULTS"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          failed=$(grep -c '^FAIL|' "$RESULTS" || true)
          passed=$(grep -c '^PASS|' "$RESULTS" || true)
          skipped=$(grep -c '^SKIP|' "$RESULTS" || true)

          echo "--- Provider verification summary ---"
          cat "$RESULTS"
          echo "-------------------------------------"

          if [ "$failed" -gt 0 ]; then
            {
              echo "**$failed provider check(s) FAILED.** Do not ship the affected connector as-is —"
              echo "update its module and tests to match what the live API actually does, then re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$failed provider check(s) failed. See the table in the run summary."
            exit 1
          fi

          if [ "$passed" -eq 0 ]; then
            echo "**Nothing was verified** — every selected provider was skipped for a missing secret." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::All selected providers were skipped; no secrets configured."
            exit 1
          fi

          msg="**All $passed verified provider(s) passed.** Their pinned contracts match the live APIs."
          if [ "$skipped" -gt 0 ]; then
            msg="$msg $skipped were skipped for missing secrets — add those secrets and re-run if you need them covered."
          fi
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

          # A GREEN TABLE IS NOT COVERAGE. The table only holds providers that
          # actually ran, so a run of one provider produces a one-row table that
          # reads exactly like a clean sweep. Name the absentees explicitly.
          echo "" >> "$GITHUB_STEP_SUMMARY"
          missing=""
          for p in close calendly instantly sendblue; do
            if ! grep -qi "|$p|" "$RESULTS" 2>/dev/null && ! grep -qiE "^[A-Z]+\|$p\|" "$RESULTS" 2>/dev/null; then
              missing="$missing $p"
            fi
          done
          if [ -n "$missing" ]; then
            echo "> **NOT covered by this run:**$missing" >> "$GITHUB_STEP_SUMMARY"
            echo ">" >> "$GITHUB_STEP_SUMMARY"
            echo "> These were not selected, so nothing above says anything about them." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> All four providers were covered by this run." >> "$GITHUB_STEP_SUMMARY"
          fi
